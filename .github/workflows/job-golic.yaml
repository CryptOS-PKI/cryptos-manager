name: GoLic
# Verify every source file carries the Apache 2.0 license header. golic
# (Bugs5382's own tool) is run through go-task (`task license`) -- the standard
# runner for every project. `golic inject --dry -x` fails the check if a header
# is missing; it never modifies files.
#
# Pull requests only, and not while the PR is a draft. There is no rerun on push
# to main: the PR run already checked the tree being merged.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
# One run per PR per workflow: a new push cancels the older PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  golic:
    name: 🔏 License headers
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: 'stable'
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3.x
          # setup-task reads its token from this input, not env. Without it
          # the release lookup hits the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify license headers
        run: |
          # Assign first, then export, so a failing `go env` is not masked.
          gobin="$(go env GOPATH)/bin"
          export PATH="${PATH}:${gobin}"
          task license
