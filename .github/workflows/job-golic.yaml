name: GoLic
# Verify every source file carries the Apache 2.0 license header. golic
# (Bugs5382's own tool) is run through go-task (`task license`) -- the standard
# runner for every project. `golic inject --dry -x` fails the check if a header
# is missing; it never modifies files.
#
# Pull requests only, and not while the PR is a draft. There is no rerun on push
# to main: the PR run already checked the tree being merged.
on:
  pull_request:
    branches: [main]
    # edited is here so retargeting a stacked PR onto main starts CI. Jobs
    # skip edited events that did not change the base (title/body edits), and
    # a skipped job is not billed.
    types: [opened, synchronize, reopened, ready_for_review, edited]
# One run per PR per workflow: a new push cancels the older PR run. A title or
# body edit gets its own group, so its run never cancels real CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && github.event.changes.base == null && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  golic:
    name: 🔏 License headers
    if: github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          # setup-task reads its token from this input, not env. Without it
          # the release lookup hits the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify license headers
        run: |
          # Assign first, then export, so a failing `go env` is not masked.
          gobin="$(go env GOPATH)/bin"
          export PATH="${PATH}:${gobin}"
          task license
