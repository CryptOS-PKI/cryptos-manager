name: PR Checks
# Authoritative CI enforcement of what the local hooks check (hooks are advisory
# and may not be installed): conventional PR title, a PR body that follows the
# template + references an issue, no AI-tells/emoji in the diff, and the
# gitleaks secret scan.
#
# ONE job, with each check as a step. Each of these checks does a few seconds of
# work, and GitHub bills every job for at least a full minute, so four separate
# jobs cost four minutes per run where one job costs one. Every check step runs
# with `!cancelled()`, so a failing check never hides the ones after it: the log
# shows every failure, and the job fails if any step failed.
#
# Draft PRs are skipped; the run happens when the PR is marked ready. This is
# the only workflow (with the label checker, which also reads the title) that
# runs its job on a title or body edit, so a title or body fix reruns one job,
# not the build. An edit reruns every step, not just title and body: the new
# result replaces the last one for the same commit, so skipping hygiene or
# gitleaks on an edit would turn an earlier failure green.
#
# The secret scan used to live in its own Gitleaks workflow that also ran on
# every push to every branch, so each PR commit was scanned twice. It now runs
# here, once per PR run. The local pre-push hook still scans before a push.
#
# Fork PRs: this runs on `pull_request` (never `pull_request_target`), so a PR
# from a fork gets a read-only token and no secrets, and every step here works
# with that. Nothing in this workflow needs to write.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
# One run per PR: a newer push or edit cancels the older run, whose result it
# replaces anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    name: ✅ PR Checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📝 PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 PR Body
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
        # An issue reference is a keyword (GitHub's closing keywords, or Refs),
        # an optional colon, then a reference GitHub links: #12, GH-12,
        # owner/repo#12, or https://github.com/owner/repo/issues/12. Casing is
        # free. A repo without its owner (repo#12) or a fragment on another
        # site does not count, because GitHub does not link those.
        run: |
          fail=0
          owner='[[:alnum:]][[:alnum:]-]*'
          repo='[[:alnum:]._-]+'
          target="(#|gh-|${owner}/${repo}#|https://github\\.com/${owner}/${repo}/issues/)[0-9]+"
          ref="(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs):?[[:space:]]+${target}([^[:alnum:]_]|\$)"
          printf '%s' "$BODY" | grep -qiE "$ref" \
            || { echo "PR body must reference an issue (e.g. 'Closes #12' or 'Refs owner/repo#12')."; fail=1; }
          printf '%s' "$BODY" | grep -qiE '##[[:space:]]*what' \
            || { echo "PR body must follow the template (a 'What and why' section)."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      - name: Checkout
        id: checkout
        if: ${{ !cancelled() }}
        uses: actions/checkout@v6
        with:
          # Full history: hygiene diffs base..head and gitleaks scans the PR's
          # commits, base..head.
          fetch-depth: 0

      - name: 🧼 PR Hygiene
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Reuse the exact rules the local pre-commit hook uses.
          source .claude/hooks/lib.sh
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              .git/*) continue ;;
              *.png|*.jpg|*.jpeg|*.gif|*.pdf|*.ico|*.svg|*.woff|*.woff2|*.ttf|*.eot|*.zip|*.gz) continue ;;
            esac
            # Emoji allowed in Markdown and .github; blocked elsewhere.
            case "$f" in
              .github/*|*.md|NOTES.txt|*/NOTES.txt) : ;;
              *) e="$(gov_find_emoji < "$f")"; [ -n "$e" ] && { echo "emoji not allowed in $f:"; echo "$e"; fail=1; } ;;
            esac
            # AI-tells blocked except in files that document the rule, and in
            # generated code (buf/protoc output carries a standard machine
            # marker; connect-go boilerplate legitimately says "Generated
            # with a version of connect ...").
            case "$f" in
              CLAUDE.md|*/CLAUDE.md|.claude/*|*/.claude/*|.github/workflows/*|*forbidden-text.txt) : ;;
              *)
                if head -n 5 "$f" | grep -qE 'Code generated .* DO NOT EDIT\.|@generated by protoc-gen-'; then :; else
                  t="$(gov_find_text_tells < "$f")"; [ -n "$t" ] && { echo "AI-tell not allowed in $f:"; echo "$t"; fail=1; }
                fi ;;
            esac
          done < <(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD")
          [ "$fail" -eq 0 ] || { echo "pr-hygiene: remove the above before merging."; exit 1; }

      # Secret scan, no paths-ignore: a secret can land in any file, docs
      # included. Hard failure: the scan exits non-zero on a finding. It runs the
      # gitleaks CLI directly rather than gitleaks/gitleaks-action@v2, which needs
      # a paid GITLEAKS_LICENSE for organization-owned repos; the CLI is free
      # everywhere and matches the `gitleaks detect` the repo runs locally.
      - name: Install gitleaks
        id: gitleaks-install
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          VERSION="8.30.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: 🔒 Gitleaks (secret scan)
        if: ${{ !cancelled() && steps.gitleaks-install.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only the PR's own commits. The checkout fetches every branch, and
          # gitleaks without --log-opts scans all of them (git log --all), so a
          # finding on another branch would fail this PR.
          # Honor a repo-local .gitleaks.toml if present. An array keeps the
          # optional flag pair intact without word splitting.
          args=(detect --source . --redact --verbose --no-banner --log-opts "$BASE..$HEAD")
          if [ -f .gitleaks.toml ]; then args+=(--config .gitleaks.toml); fi
          gitleaks "${args[@]}"
