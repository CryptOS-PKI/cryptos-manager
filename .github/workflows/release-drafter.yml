name: Release Drafter

# Drafts the next release on push to main, using the built-in GITHUB_TOKEN --
# no org GitHub App required.
#
# Push to main only. It used to run on pull requests too, where it only ran the
# autolabeler; the Label Checker workflow applies and checks the label on every
# PR, so that run cost a job per PR event for nothing. Dropping it also keeps
# fork PRs clean: they get no secrets, so the drafter step could never run for
# them.

on:
  push:
    branches: [main]
  # cryptos-manager and cryptos-web are versioned in lockstep, but each repo
  # resolves its next version from its own labels, so the two drafts can come
  # out different. Dispatching with a version (no leading "v", e.g.
  # 0.1.0-rc.2) sets this repo's draft to it. Both drafts must carry the same
  # version before either is published; the merge freeze keeps a later push
  # from resolving it again.
  workflow_dispatch:
    inputs:
      version:
        description: "Draft this version instead of the one resolved from labels (no leading v, e.g. 0.1.0-rc.2)"
        required: false
        default: ""

permissions:
  contents: read

# Release runs queue and are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Release Drafter
        uses: Bugs5382/release-drafter-action@de0c4559d69039b8b371ef951b62a2532ad3593f  # v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          extends: CryptOS-PKI/.github@aa8761a2903d759dbb5f48b8d5e3517a9dc6da79
          first-version: 0.1.0
          prerelease: true
          prerelease-identifier: rc
          version: ${{ inputs.version }}
