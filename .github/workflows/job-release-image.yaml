name: "🚀 Release image"

# A v* tag publishes the manager image and its Helm chart: build with the
# web console from cryptos-web's tag of the same name (the two repos are
# versioned in lockstep), prove the image with the read-only health check, then push
# only if that check passes. Each platform (linux/amd64, linux/arm64) builds
# and proves natively on its own runner, with no QEMU, and pushes untagged by
# digest; the publish job joins the digests into one manifest list under the
# release tags, so a tag only ever appears once both platforms have passed.
# `latest` moves only on a stable tag (no "-" prerelease suffix); an rc tag
# publishes its own tag but never latest. The chart version always matches the
# tag (without its leading "v"), and the chart references the image by tag, so
# the manifest list needs nothing from it. The node and appliance stay
# source-only. Nothing here is signed: no provenance, SBOM or other attestation
# is generated or attached, so the list holds exactly the two platform images.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: "Build, prove and push the manager image (${{ matrix.arch }})"
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The image build compiles the web UI and the Go binary; the gha layer
    # cache keeps repeat builds well under this.
    timeout-minutes: 45
    env:
      IMAGE: manager:release-check
      NET: fleet-release-check
      REGISTRY_IMAGE: ghcr.io/cryptos-pki/cryptos-manager
    steps:
      # cryptos-manager and cryptos-web are versioned in lockstep: the image
      # for vX.Y.Z embeds the web console from cryptos-web's vX.Y.Z. That
      # release has to be published first; the releases/tags endpoint only
      # returns published releases, so a draft or a missing tag fails here.
      - name: Require the matching cryptos-web release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! draft="$(gh api "repos/CryptOS-PKI/cryptos-web/releases/tags/$TAG" -q .draft 2>/dev/null)" || [ "$draft" != "false" ]; then
            echo "::error::cryptos-web has no published release at $TAG. The two repos are versioned in lockstep: publish cryptos-web's $TAG draft first (with the same version), then re-run this workflow."
            exit 1
          fi
          echo "web release: $TAG"

      - name: Checkout manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: manager

      - name: Checkout web (same tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: CryptOS-PKI/cryptos-web
          ref: refs/tags/${{ github.ref_name }}
          path: web

      # Resolve what is actually being built, so the image can report it (#81).
      # The web SHA rather than the ref: "which web" is half of any UI report,
      # and a moving ref does not answer it. The build date is the tagged
      # commit's time, not the clock, so a rebuild of the tag stamps the same
      # value; SOURCE_DATE_EPOCH carries it to BuildKit for layer timestamps.
      - name: Resolve build identity
        id: build
        run: |
          echo "web_sha=$(git -C web rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          epoch="$(git -C manager log -1 --format=%ct)"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build.outputs.epoch }}
        with:
          context: .
          file: manager/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            WEB_REF=${{ steps.build.outputs.web_sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Image runs as nonroot with a health check
        run: |
          set -euo pipefail
          user="$(docker image inspect -f '{{.Config.User}}' "$IMAGE")"
          echo "user=$user"
          [ "$user" = "65532:65532" ]
          docker image inspect -f '{{json .Config.Healthcheck}}' "$IMAGE" | tee /dev/stderr | grep -q -- '-healthcheck'

      - name: Start Postgres
        run: |
          set -euo pipefail
          docker network create "$NET"
          docker run -d --name pg --network "$NET" \
            -e POSTGRES_DB=manager -e POSTGRES_USER=manager -e POSTGRES_PASSWORD=release \
            postgres:18-alpine
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U manager -d manager && exit 0
            sleep 2
          done
          exit 1

      # No tlsCert/tlsKey or operator CA: the manager serves its self-signed
      # bootstrap certificate, which is enough to exercise the TLS listener the
      # health probe talks to.
      - name: Run the image read-only
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/fleet"
          mkdir -p "$cfg"
          cat > "$cfg/config.yaml" <<'EOF'
          listen: "0.0.0.0:8443"
          httpRedirectListen: ""
          database_url: "postgres://manager:release@pg:5432/manager?sslmode=disable"
          nodes: []
          EOF
          sudo chown -R 65532:65532 "$cfg"
          docker run -d --name manager --network "$NET" \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --health-interval 2s --health-start-period 5s \
            -p 8443:8443 \
            -v "$cfg/config.yaml:/etc/cryptos/fleet/config.yaml:ro" \
            -v node-creds:/var/lib/cryptos-manager/node-creds \
            "$IMAGE"

      - name: Becomes healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' manager)"
            echo "health=$state"
            [ "$state" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' manager)" = true ] || break
            sleep 2
          done
          [ "$state" = healthy ]
          curl -sSk https://127.0.0.1:8443/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sSk https://127.0.0.1:8443/version | tee /dev/stderr | grep -q "\"version\":\"${GITHUB_REF_NAME}\""

      - name: Manager log
        if: ${{ always() }}
        run: docker logs manager || true

      # Only now, with the health check behind us, does anything touch the
      # registry, and only as an untagged digest for the publish job to join.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build.outputs.epoch }}
        with:
          context: .
          file: manager/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            WEB_REF=${{ steps.build.outputs.web_sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Save the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: "Publish the multi-arch manifest list"
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REGISTRY_IMAGE: ghcr.io/cryptos-pki/cryptos-manager
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A stable tag carries no "-" (an rc does), so that is also what decides
      # whether `latest` moves.
      - name: Join the platforms under the release tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tags=(-t "$REGISTRY_IMAGE:$tag")
          case "$tag" in
            *-*) ;;
            *) tags+=(-t "$REGISTRY_IMAGE:latest") ;;
          esac
          sources=()
          for digest in *; do
            sources+=("$REGISTRY_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Check both platforms are in the list
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect "$REGISTRY_IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | .os + "/" + .architecture] | unique | join(",")')"
          echo "platforms: $platforms"
          [ "$platforms" = "linux/amd64,linux/arm64" ]

  chart:
    name: "Package and publish the Helm chart"
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package chart/fleet-manager --version "$version" --app-version "$version"
          helm push "fleet-manager-${version}.tgz" oci://ghcr.io/cryptos-pki/charts
