name: "🚀 Release image"

# A v* tag publishes the manager image and its Helm chart: build from the
# pinned web ref, prove the image with the read-only health check, then push
# only if that check passes. `latest` moves only on a stable tag (no "-"
# prerelease suffix); an rc tag publishes its own tag but never latest. The
# chart version always matches the tag (without its leading "v"). The node
# and appliance stay source-only. Nothing here is signed: no provenance, SBOM
# or other attestation is generated or attached.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: "Build, prove and publish the manager image"
    runs-on: ubuntu-24.04
    # The image build compiles the web UI and the Go binary; the gha layer
    # cache keeps repeat builds well under this.
    timeout-minutes: 45
    env:
      IMAGE: manager:release-check
      NET: fleet-release-check
      REGISTRY_IMAGE: ghcr.io/cryptos-pki/cryptos-manager
    steps:
      # A tagged image has to be rebuildable from the tag. Falling back to
      # web's main would embed whatever web happened to be at build time, so
      # the release refuses to build until the web ref is pinned.
      - name: Require a pinned web ref
        env:
          WEB_RELEASE_REF: ${{ vars.WEB_RELEASE_REF }}
        run: |
          if [ -z "$WEB_RELEASE_REF" ]; then
            echo "::error::Set the WEB_RELEASE_REF repository variable to a web tag or commit SHA before cutting a release."
            exit 1
          fi
          echo "web ref: $WEB_RELEASE_REF"

      - name: Checkout manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: manager

      - name: Checkout web (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: CryptOS-PKI/cryptos-web
          ref: ${{ vars.WEB_RELEASE_REF }}
          path: web

      # Resolve what is actually being built, so the image can report it (#81).
      # The web SHA rather than the ref: "which web" is half of any UI report,
      # and a moving ref does not answer it. The build date is the tagged
      # commit's time, not the clock, so a rebuild of the tag stamps the same
      # value; SOURCE_DATE_EPOCH carries it to BuildKit for layer timestamps.
      - name: Resolve build identity
        id: build
        run: |
          echo "web_sha=$(git -C web rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          epoch="$(git -C manager log -1 --format=%ct)"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build.outputs.epoch }}
        with:
          context: .
          file: manager/Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            WEB_REF=${{ steps.build.outputs.web_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as nonroot with a health check
        run: |
          set -euo pipefail
          user="$(docker image inspect -f '{{.Config.User}}' "$IMAGE")"
          echo "user=$user"
          [ "$user" = "65532:65532" ]
          docker image inspect -f '{{json .Config.Healthcheck}}' "$IMAGE" | tee /dev/stderr | grep -q -- '-healthcheck'

      - name: Start Postgres
        run: |
          set -euo pipefail
          docker network create "$NET"
          docker run -d --name pg --network "$NET" \
            -e POSTGRES_DB=manager -e POSTGRES_USER=manager -e POSTGRES_PASSWORD=release \
            postgres:18-alpine
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U manager -d manager && exit 0
            sleep 2
          done
          exit 1

      # No tlsCert/tlsKey or operator CA: the manager serves its self-signed
      # bootstrap certificate, which is enough to exercise the TLS listener the
      # health probe talks to.
      - name: Run the image read-only
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/fleet"
          mkdir -p "$cfg"
          cat > "$cfg/config.yaml" <<'EOF'
          listen: "0.0.0.0:8443"
          httpRedirectListen: ""
          database_url: "postgres://manager:release@pg:5432/manager?sslmode=disable"
          nodes: []
          EOF
          sudo chown -R 65532:65532 "$cfg"
          docker run -d --name manager --network "$NET" \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --health-interval 2s --health-start-period 5s \
            -p 8443:8443 \
            -v "$cfg/config.yaml:/etc/cryptos/fleet/config.yaml:ro" \
            -v node-creds:/var/lib/cryptos-manager/node-creds \
            "$IMAGE"

      - name: Becomes healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' manager)"
            echo "health=$state"
            [ "$state" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' manager)" = true ] || break
            sleep 2
          done
          [ "$state" = healthy ]
          curl -sSk https://127.0.0.1:8443/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sSk https://127.0.0.1:8443/version | tee /dev/stderr | grep -q "\"version\":\"${GITHUB_REF_NAME}\""

      - name: Manager log
        if: ${{ always() }}
        run: docker logs manager || true

      # Only now, with the health check behind us, does anything touch the
      # registry. A stable tag carries no "-" (an rc does), so that is also
      # what decides whether `latest` moves.
      - name: Compute publish tags
        id: tags
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *-*) latest=false ;;
            *) latest=true ;;
          esac
          tags="$REGISTRY_IMAGE:$tag"
          if [ "$latest" = true ]; then
            tags="$tags,$REGISTRY_IMAGE:latest"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build.outputs.epoch }}
        with:
          context: .
          file: manager/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            WEB_REF=${{ steps.build.outputs.web_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: "Package and publish the Helm chart"
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package chart/fleet-manager --version "$version" --app-version "$version"
          helm push "fleet-manager-${version}.tgz" oci://ghcr.io/cryptos-pki/charts
