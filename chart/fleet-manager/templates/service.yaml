apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-manager.name" . }}
  labels: {{- include "fleet-manager.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "fleet-manager.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- if .Values.httpRedirectListen }}
    - name: http-redirect
      port: {{ .Values.service.httpPort }}
      targetPort: {{ .Values.service.httpTargetPort }}
      protocol: TCP
    {{- end }}
