apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-manager.name" . }}
  labels: {{- include "fleet-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fleet-manager.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "fleet-manager.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "fleet-manager.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/cryptos/fleet/config.yaml"]
          # Read-only root, as the image is built to run. The chart mounts no
          # volume for node credentials yet, so adoption fails with a
          # read-only filesystem error rather than writing admin keys into a
          # container layer that is lost when the pod goes.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: {{ if .Values.authBypass }}HTTP{{ else }}HTTPS{{ end }}
            periodSeconds: 10
            timeoutSeconds: 5
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
            {{- if .Values.httpRedirectListen }}
            - name: http-redirect
              containerPort: {{ .Values.service.httpTargetPort }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/cryptos/fleet/config.yaml
              subPath: config.yaml
            {{- if not .Values.authBypass }}
            - name: tls
              mountPath: /etc/cryptos/fleet/tls
              readOnly: true
            - name: operator-ca
              mountPath: /etc/cryptos/fleet/operator-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "fleet-manager.name" . }}-config
        {{- if not .Values.authBypass }}
        - name: tls
          secret:
            secretName: {{ required "tls.certSecret is required when authBypass is false" .Values.tls.certSecret }}
        - name: operator-ca
          configMap:
            name: {{ required "operatorCA.configMap is required when authBypass is false" .Values.operatorCA.configMap }}
        {{- end }}
