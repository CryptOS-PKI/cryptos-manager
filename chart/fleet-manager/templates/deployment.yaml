apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-manager.name" . }}
  labels: {{- include "fleet-manager.labels" . | nindent 4 }}
{{- $rwx := has "ReadWriteMany" .Values.nodeCreds.accessModes }}
{{- if and (gt (int .Values.replicaCount) 1) (not $rwx) }}
{{- fail "replicaCount > 1 needs nodeCreds.accessModes to include ReadWriteMany: every pod must hold every adopted node's admin key" }}
{{- end }}
{{- if not (has .Values.storage.mode (list "" "memory")) }}
{{- fail (printf "storage.mode must be empty or \"memory\", not %q" .Values.storage.mode) }}
{{- end }}
{{- if and .Values.database.existingSecret (eq .Values.storage.mode "memory") }}
{{- fail "database.existingSecret and storage.mode: memory are mutually exclusive: choose one durable store" }}
{{- end }}
{{- if and (not .Values.database.existingSecret) (ne .Values.storage.mode "memory") }}
{{- fail "either database.existingSecret or storage.mode: memory must be set: the chart no longer falls back to an undeclared in-memory store (see docs/storage.md)" }}
{{- end }}
{{- if and (eq .Values.storage.mode "memory") (gt (int .Values.replicaCount) 1) }}
{{- fail "storage.mode: memory supports replicaCount: 1 only: the fleet nodes are the durable record, and two replicas would each hold a different view of them" }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # A ReadWriteOnce volume cannot attach to the old and new pod at once.
    type: {{ if $rwx }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fleet-manager.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "fleet-manager.labels" . | nindent 8 }}
      annotations:
        # A config-only upgrade changes the ConfigMap but not the pod spec;
        # this makes it roll the pod so the manager reads the new config.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "fleet-manager.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the node-creds volume writable by the manager whatever owner
        # the provisioner gives it.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "fleet-manager.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/cryptos/fleet/config.yaml"]
          # Read-only root, as the image is built to run; node-creds is the one
          # writable mount.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if .Values.database.existingSecret }}
          env:
            - name: MANAGER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
          {{- else if eq .Values.storage.mode "memory" }}
          env:
            # Names the single-replica guard's Lease. Every resource in this
            # chart shares the fixed name fleet-manager.name (one release per
            # namespace; see the Deployment's own metadata.name above), so
            # this needs no further scoping. See internal/singlereplica and
            # docs/storage.md.
            - name: MANAGER_REPLICA_LOCK_NAME
              value: {{ printf "%s-memory-store" (include "fleet-manager.name" .) | quote }}
          {{- end }}
          # The manager waits up to 90s for Postgres before it listens.
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            failureThreshold: 12
          # Liveness only asks whether the process still accepts connections:
          # /healthz also checks Postgres, and a database outage should take
          # the pods out of the Service, not restart them.
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: {{ if .Values.authBypass }}HTTP{{ else }}HTTPS{{ end }}
            periodSeconds: 10
            timeoutSeconds: 5
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
            {{- if .Values.httpRedirectListen }}
            - name: http-redirect
              containerPort: {{ .Values.service.httpTargetPort }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/cryptos/fleet/config.yaml
              subPath: config.yaml
            - name: node-creds
              mountPath: /var/lib/cryptos-manager/node-creds
            {{- range $i, $n := .Values.nodes }}
            {{- if $n.adminCredsSecret }}
            - name: node-admin-{{ $i }}
              mountPath: {{ include "fleet-manager.nodeAdminDir" $n.name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and (not .Values.authBypass) .Values.tls.certSecret }}
            - name: tls
              mountPath: /etc/cryptos/fleet/tls
              readOnly: true
            {{- end }}
            {{- if and (not .Values.authBypass) .Values.operatorCA.configMap }}
            - name: operator-ca
              mountPath: /etc/cryptos/fleet/operator-ca
              readOnly: true
            {{- end }}
            {{- if .Values.operatorCRL.configMap }}
            - name: operator-crl
              mountPath: {{ include "fleet-manager.operatorCRLDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "fleet-manager.name" . }}-config
        - name: node-creds
          persistentVolumeClaim:
            claimName: {{ .Values.nodeCreds.existingClaim | default (printf "%s-node-creds" (include "fleet-manager.name" .)) }}
        {{- range $i, $n := .Values.nodes }}
        {{- if $n.adminCredsSecret }}
        - name: node-admin-{{ $i }}
          secret:
            secretName: {{ $n.adminCredsSecret | quote }}
            # Group-readable for the pod's fsGroup; the manager runs as 65532.
            defaultMode: 0440
        {{- end }}
        {{- end }}
        {{- if and (not .Values.authBypass) .Values.tls.certSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.certSecret }}
        {{- end }}
        {{- if and (not .Values.authBypass) .Values.operatorCA.configMap }}
        - name: operator-ca
          configMap:
            name: {{ .Values.operatorCA.configMap }}
        {{- end }}
        {{- if .Values.operatorCRL.configMap }}
        - name: operator-crl
          configMap:
            name: {{ .Values.operatorCRL.configMap | quote }}
        {{- end }}
