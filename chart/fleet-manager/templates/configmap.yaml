apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleet-manager.name" . }}-config
  labels: {{- include "fleet-manager.labels" . | nindent 4 }}
data:
  config.yaml: |
    listen: {{ .Values.listen | quote }}
    authBypass: {{ .Values.authBypass }}
    corsOrigins: {{ toJson .Values.corsOrigins }}
    httpRedirectListen: {{ .Values.httpRedirectListen | quote }}
    {{- if ne (int .Values.service.port) 443 }}
    # The redirect has to name the port clients reach, not the listener's.
    httpsPublicPort: {{ .Values.service.port | quote }}
    {{- end }}
    {{- if not .Values.authBypass }}
    tlsCert: /etc/cryptos/fleet/tls/tls.crt
    tlsKey: /etc/cryptos/fleet/tls/tls.key
    operatorCAPath: /etc/cryptos/fleet/operator-ca/operator-ca.pem
    {{- end }}
    {{- if .Values.operatorCANode }}
    operator_ca_node: {{ .Values.operatorCANode | quote }}
    {{- end }}
    {{- if .Values.mcp.enabled }}
    {{- if .Values.authBypass }}
    {{- fail "mcp.enabled requires authBypass: false" }}
    {{- end }}
    {{- if not .Values.operatorCANode }}
    {{- fail "mcp.enabled requires operatorCANode (the operator-certificate revocation source)" }}
    {{- end }}
    mcp:
      enabled: true
      public_url: {{ required "mcp.publicURL is required when mcp.enabled is true" .Values.mcp.publicURL | quote }}
    {{- end }}
    nodes: {{ toJson .Values.nodes }}
