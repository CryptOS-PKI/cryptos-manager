image:
  repository: ghcr.io/cryptos-pki/manager
  tag: ""            # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

# One pod by default: the node-creds volume below is ReadWriteOnce. More than
# one needs a ReadWriteMany volume, because every pod must hold the admin key
# of every adopted node, and the chart refuses to render otherwise.
replicaCount: 1

service:
  port: 443
  targetPort: 8443
  # Plaintext port that only redirects to HTTPS, so an operator who types a
  # hostname without a scheme reaches the login page. httpPort is what clients
  # connect to; httpTargetPort is the in-container listener, which cannot be a
  # low port because the image runs unprivileged.
  httpPort: 80
  httpTargetPort: 8080

# Manager listen address inside the container.
listen: "0.0.0.0:8443"

# Plaintext redirect listener inside the container. Empty disables it.
httpRedirectListen: "0.0.0.0:8080"

# Dev-only. Leave false for real deployments (enables mTLS client-cert auth).
authBypass: false

corsOrigins: []

# Bring-your-own trust material (object names in the release namespace).
tls:
  certSecret: ""     # TLS secret with tls.crt / tls.key for the server cert
operatorCA:
  configMap: ""      # ConfigMap with operator-ca.pem (client-auth trust anchor)

# Name of the node in `nodes` that acts as the operator CA. The manager routes
# operator-credential issuance and revocation there and polls its revoked
# serials to enforce operator-certificate revocation. Empty disables both.
# Required when mcp.enabled is true.
operatorCANode: ""

# Model Context Protocol endpoint for AI agents, served at /mcp on the same
# listener (see docs/mcp.md). Off by default. Enabling it needs
# authBypass: false and operatorCANode, or the chart refuses to render.
mcp:
  enabled: false
  # External https origin clients reach, with no path, for example
  # https://fleetos.example.org. Required when enabled.
  publicURL: ""

# Postgres holds the fleet's durable state: nodes, enrollments, operator
# credentials and the hash-chained audit log. Name a Secret in the release
# namespace whose secretKey holds the DSN, for example
# postgres://manager:<password>@db:5432/manager. It reaches the manager as
# MANAGER_DATABASE_URL, so the password never lands in the rendered config.
# Required unless authBypass is true; without it the manager runs its
# in-memory demo store, which is emptied on every restart.
database:
  existingSecret: ""
  secretKey: "database-url"

# The admin key the manager mints for every node it adopts, at
# /var/lib/cryptos-manager/node-creds. An adopted node trusts only that key,
# so losing it locks the manager out of the node until it is reset from its
# console. The claim is kept on `helm uninstall`; back it up with the
# database.
nodeCreds:
  existingClaim: ""   # use this PVC instead of creating one
  storageClass: ""    # empty uses the cluster default
  accessModes: ["ReadWriteOnce"]
  size: 1Gi

# Fleet node inventory. Each node's admin cert/key/ca are mounted separately by
# the operator; paths here must match those mounts.
nodes: []
